[package]
name = "windows_features_searcher"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
debug-assertions = false

[dependencies]
regex = { version = "1.13" }
syn = {version="3", features = ["full", "parsing","derive", "extra-traits", "visit"] }
quote = {version="1.0"}
serde_json = {version="1.0"}
serde = {version="1.0", features = ["derive"]}
windows = {version = "0.62"}
