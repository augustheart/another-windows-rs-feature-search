name: Rust

on:
   workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-2025-vs2026

    steps:
    - name: get version
      id: ver
      shell: pwsh
      run: |
       $short = $env:GITHUB_SHA.Substring(0,7)
       $version = "v-$short"
       "version=$version" >> $env:GITHUB_OUTPUT
       Write-Host "版本号为: $version"
    - uses: actions/checkout@v4
    #- run: rustup target add x86_64-pc-windows-msvc
    - name: build binary
      run: cargo run --target x86_64-pc-windows-msvc -r 0
    - name: show result
      shell: bash
      run: ls -lh
    - name: make release
      run: mkdir release
    - name: build zip
      shell: bash
      run: 7z a -tzip -mx=9 release/windows_rs_feature-${{steps.ver.version}}.zip *.html *.json
    - name: upload
      uses: actions/upload-artifact@v4
      with:
          name: release-assest
          path: release/*.zip
      

